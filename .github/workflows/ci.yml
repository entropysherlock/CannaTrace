name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cannatrace
          POSTGRES_PASSWORD: cannatrace
          POSTGRES_DB: cannatrace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cannatrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cannatrace:cannatrace@localhost:5432/cannatrace
      AUTH_SECRET: ci-only-secret-not-used-anywhere-real
      # Test-only key for encrypting saved Tally API keys. Real servers use their own secret value.
      AI_KEY_ENCRYPTION_KEY: Y2ktb25seS1rZXktbm90LWZvci1yZWFsLXVzZS0zMiE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
          # The database tests above each create a business, which counts toward the hourly sign-up
          # limit; lift it here so the browser sign-up test isn't refused. Real servers keep the default.
          SIGNUPS_PER_HOUR: "1000"
