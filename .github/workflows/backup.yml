name: Nightly backup

# Copies the production database every night into a private, encrypted file kept for 30 days.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   BACKUP_DATABASE_URL  the production connection string (use Neon's read-only role if you have one)
#   BACKUP_PASSPHRASE    a long random phrase; without it the file cannot be opened, so save it in a password manager
# With either secret missing, this does nothing.
on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        id: gate
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "Backup secrets are not set; skipping."; echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Dump the database
        if: steps.gate.outputs.run == 'yes'
        run: |
          docker run --rm -e URL="$BACKUP_DATABASE_URL" -v "$PWD:/out" postgres:17 \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges --file /out/cannatrace.dump "$URL"'
          test -s cannatrace.dump
      - name: Encrypt
        if: steps.gate.outputs.run == 'yes'
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 --output cannatrace.dump.gpg cannatrace.dump
          rm cannatrace.dump
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'yes'
        with:
          name: cannatrace-backup-${{ github.run_id }}
          path: cannatrace.dump.gpg
          retention-days: 30
          if-no-files-found: error
